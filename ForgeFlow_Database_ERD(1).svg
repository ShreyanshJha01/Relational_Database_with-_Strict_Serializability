<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>.bg{fill:#f7f9fc}.tbl{fill:#fff;stroke:#54708e;stroke-width:2;rx:10}.head{fill:#e8f1ff;stroke:#54708e;stroke-width:2;rx:10}.title{font:700 26px Arial;fill:#142235}.th{font:700 17px Arial;fill:#142235}.tx{font:14px Arial;fill:#263548}.rel{stroke:#64748b;stroke-width:2;fill:none}.note{font:14px Arial;fill:#536579}</style></defs>
<rect class="bg" width="1400" height="900"/><text x="700" y="42" text-anchor="middle" class="title">ForgeFlow — Database ERD (SQLAlchemy Models)</text>
<!-- users -->
<rect x="40" y="95" width="250" height="150" class="tbl"/><rect x="40" y="95" width="250" height="36" class="head"/><text x="165" y="119" text-anchor="middle" class="th">users</text><text x="58" y="155" class="tx">PK id</text><text x="58" y="179" class="tx">username (unique)</text><text x="58" y="203" class="tx">password_hash</text><text x="58" y="227" class="tx">created_at</text>
<!-- projects -->
<rect x="380" y="80" width="300" height="245" class="tbl"/><rect x="380" y="80" width="300" height="36" class="head"/><text x="530" y="104" text-anchor="middle" class="th">projects</text><text x="398" y="141" class="tx">PK id</text><text x="398" y="165" class="tx">FK owner_id → users.id</text><text x="398" y="189" class="tx">name, slug (unique)</text><text x="398" y="213" class="tx">workspace_path, branch</text><text x="398" y="237" class="tx">status, current_task</text><text x="398" y="261" class="tx">demo_url, demo_status</text><text x="398" y="285" class="tx">remote_url, active_run_id</text><text x="398" y="309" class="tx">created_at</text>
<!-- runs -->
<rect x="780" y="80" width="300" height="245" class="tbl"/><rect x="780" y="80" width="300" height="36" class="head"/><text x="930" y="104" text-anchor="middle" class="th">runs</text><text x="798" y="141" class="tx">PK id</text><text x="798" y="165" class="tx">FK project_id → projects.id</text><text x="798" y="189" class="tx">request, status, current_agent</text><text x="798" y="213" class="tx">iteration, state (JSON)</text><text x="798" y="237" class="tx">summary, error</text><text x="798" y="261" class="tx">cancel_requested</text><text x="798" y="285" class="tx">finished_at, created_at</text>
<!-- tasks -->
<rect x="1150" y="80" width="210" height="150" class="tbl"/><rect x="1150" y="80" width="210" height="36" class="head"/><text x="1255" y="104" text-anchor="middle" class="th">tasks</text><text x="1165" y="141" class="tx">PK id</text><text x="1165" y="165" class="tx">FK run_id → runs.id</text><text x="1165" y="189" class="tx">description, status</text><text x="1165" y="213" class="tx">created_at</text>
<!-- events -->
<rect x="40" y="390" width="290" height="190" class="tbl"/><rect x="40" y="390" width="290" height="36" class="head"/><text x="185" y="414" text-anchor="middle" class="th">events</text><text x="58" y="451" class="tx">PK id</text><text x="58" y="475" class="tx">FK project_id → projects.id</text><text x="58" y="499" class="tx">FK run_id → runs.id (nullable)</text><text x="58" y="523" class="tx">agent, kind, message</text><text x="58" y="547" class="tx">details (JSON), created_at</text>
<!-- toolcalls -->
<rect x="390" y="390" width="280" height="190" class="tbl"/><rect x="390" y="390" width="280" height="36" class="head"/><text x="530" y="414" text-anchor="middle" class="th">tool_calls</text><text x="408" y="451" class="tx">PK id</text><text x="408" y="475" class="tx">FK run_id → runs.id</text><text x="408" y="499" class="tx">agent, name</text><text x="408" y="523" class="tx">arguments (JSON), result</text><text x="408" y="547" class="tx">success, created_at</text>
<!-- tests -->
<rect x="730" y="390" width="300" height="190" class="tbl"/><rect x="730" y="390" width="300" height="36" class="head"/><text x="880" y="414" text-anchor="middle" class="th">test_runs</text><text x="748" y="451" class="tx">PK id</text><text x="748" y="475" class="tx">FK project_id → projects.id</text><text x="748" y="499" class="tx">FK run_id → runs.id</text><text x="748" y="523" class="tx">phase, status, counts</text><text x="748" y="547" class="tx">cases (JSON), output</text>
<!-- checkpoint -->
<rect x="1080" y="390" width="280" height="190" class="tbl"/><rect x="1080" y="390" width="280" height="36" class="head"/><text x="1220" y="414" text-anchor="middle" class="th">checkpoints</text><text x="1098" y="451" class="tx">PK id</text><text x="1098" y="475" class="tx">FK project_id → projects.id</text><text x="1098" y="499" class="tx">FK run_id → runs.id (unique)</text><text x="1098" y="523" class="tx">commit_hash, branch, status</text><text x="1098" y="547" class="tx">test counts, pushed, report</text>
<!-- git commits -->
<rect x="520" y="675" width="310" height="155" class="tbl"/><rect x="520" y="675" width="310" height="36" class="head"/><text x="675" y="699" text-anchor="middle" class="th">git_commits</text><text x="538" y="736" class="tx">PK id</text><text x="538" y="760" class="tx">FK project_id → projects.id</text><text x="538" y="784" class="tx">FK checkpoint_id → checkpoints.id</text><text x="538" y="808" class="tx">commit_hash, branch, push_status</text>
<!-- tasks line -->
<path d="M290 170 H380" class="rel"/><text x="310" y="158" class="note">1:N</text><path d="M680 170 H780" class="rel"/><text x="715" y="158" class="note">1:N</text><path d="M1080 170 H1150" class="rel"/><text x="1090" y="158" class="note">1:N</text>
<path d="M530 325 V350 H185 V390" class="rel"/><path d="M930 325 V360 H185 V390" class="rel"/><path d="M930 325 V365 H530 V390" class="rel"/><path d="M930 325 V375 H880 V390" class="rel"/><path d="M930 325 V380 H1220 V390" class="rel"/>
<path d="M1220 580 V625 H675 V675" class="rel"/><text x="850" y="615" class="note">checkpoint → git_commits</text>
<text x="700" y="870" text-anchor="middle" class="note">PK = primary key • FK = foreign key • JSON fields hold flexible workflow/test/report payloads</text>
</svg>