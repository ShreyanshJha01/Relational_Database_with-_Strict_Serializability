<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52657a"/></marker><style>
.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#e8f1ff;stroke:#4776b8}.green{fill:#e8f7ef;stroke:#38865b}.orange{fill:#fff1df;stroke:#b77927}.purple{fill:#f2eaff;stroke:#8761b3}.title{font:700 27px Arial;fill:#142235}.h{font:700 18px Arial;fill:#142235}.t{font:15px Arial;fill:#263548}.s{font:13px Arial;fill:#46566b}.edge{stroke:#52657a;stroke-width:2.2;fill:none;marker-end:url(#a)}
</style></defs><rect class="bg" width="1400" height="950"/><text x="700" y="42" text-anchor="middle" class="title">ForgeFlow — Low-Level Workflow (LLD)</text>
<rect x="470" y="70" width="460" height="70" class="box blue"/><text x="700" y="98" text-anchor="middle" class="h">POST /projects/{id}/chat or /run</text><text x="700" y="121" text-anchor="middle" class="t">Authenticate • authorize ownership • create Run</text>
<path class="edge" d="M700 140 V180"/><rect x="420" y="180" width="560" height="70" class="box purple"/><text x="700" y="208" text-anchor="middle" class="h">execute_run(project_id, run_id)</text><text x="700" y="231" text-anchor="middle" class="t">Load persisted state • set budgets • publish stage events</text>
<path class="edge" d="M700 250 V290"/><rect x="490" y="290" width="420" height="68" class="box blue"/><text x="700" y="318" text-anchor="middle" class="h">1. PLAN — Supervisor</text><text x="700" y="341" text-anchor="middle" class="t">Read source/history → tasks + acceptance criteria</text>
<path class="edge" d="M700 358 V397"/><rect x="490" y="397" width="420" height="68" class="box green"/><text x="700" y="425" text-anchor="middle" class="h">2. DEVELOP — Developer</text><text x="700" y="448" text-anchor="middle" class="t">Use guarded file tools; inspect before modifying</text>
<path class="edge" d="M700 465 V504"/><rect x="490" y="504" width="420" height="68" class="box orange"/><text x="700" y="532" text-anchor="middle" class="h">3. TEST — Tester</text><text x="700" y="555" text-anchor="middle" class="t">Preserve regression tests • run pytest • parse JUnit</text>
<path class="edge" d="M700 572 V605"/><polygon points="700,605 820,660 700,715 580,660" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="700" y="655" text-anchor="middle" class="h">Tests pass?</text><text x="700" y="677" text-anchor="middle" class="s">and run not cancelled?</text>
<path class="edge" d="M580 660 H350 V700"/><text x="410" y="648" class="s">No / failures</text><rect x="170" y="700" width="360" height="78" class="box orange"/><text x="350" y="730" text-anchor="middle" class="h">Repair loop</text><text x="350" y="753" text-anchor="middle" class="t">Failure evidence → Developer → Tester</text><path class="edge" d="M350 700 V430 H490"/>
<path class="edge" d="M820 660 H1050 V700"/><text x="910" y="648" class="s">Yes</text><rect x="870" y="700" width="360" height="78" class="box purple"/><text x="1050" y="730" text-anchor="middle" class="h">4. VALIDATE — Supervisor</text><text x="1050" y="753" text-anchor="middle" class="t">Requirements review + preview HTTP 200</text>
<path class="edge" d="M1050 778 V812"/><polygon points="1050,812 1150,850 1050,888 950,850" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="1050" y="855" text-anchor="middle" class="h">Valid?</text>
<path class="edge" d="M950 850 H700 V900"/><text x="770" y="837" class="s">No → fail / repair</text><path class="edge" d="M1150 850 H1280 V900"/><text x="1170" y="837" class="s">Yes</text>
<rect x="535" y="900" width="330" height="42" class="box orange"/><text x="700" y="927" text-anchor="middle" class="h">Persist failed state; no checkpoint</text>
<rect x="1110" y="900" width="250" height="42" class="box green"/><text x="1235" y="927" text-anchor="middle" class="h">5. CHECKPOINT / Git</text>
</svg>